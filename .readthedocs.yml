# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
  configuration: docs/conf.py

formats:
  - htmlzip

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      # Install uv
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      # Create virtual environment with uv
      - uv venv $READTHEDOCS_VIRTUALENV_PATH
    install:
      # Install jax-md and doc dependencies with uv
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs
    pre_build:
      - cp -r examples docs/
      # Notebooks executed by the Examples workflow on main; other versions execute all but the tutorials.
      - 'if [ "$READTHEDOCS_VERSION" = "main" ] && curl -fsSL -o notebooks.tar.gz https://github.com/jax-md/jax-md/releases/download/docs-notebooks/notebooks.tar.gz; then tar -xzf notebooks.tar.gz -C docs/examples; fi'
      - 'for f in docs/examples/*.py docs/examples/units/*.py docs/examples/tutorial/*.py; do [ -f "${f%.py}.ipynb" ] || uv run jupytext --to notebook "$f"; done'
      - rm docs/examples/*.py
      - rm docs/examples/units/*.py
      - rm docs/examples/tutorial/*.py
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/notebooks
      - mkdir -p $READTHEDOCS_OUTPUT/html/notebooks/units
      - mkdir -p $READTHEDOCS_OUTPUT/html/notebooks/tutorial
      - cp docs/examples/*.ipynb $READTHEDOCS_OUTPUT/html/notebooks/
      - cp docs/examples/units/*.ipynb $READTHEDOCS_OUTPUT/html/notebooks/units/
      - cp docs/examples/tutorial/*.ipynb $READTHEDOCS_OUTPUT/html/notebooks/tutorial/
